<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Iyanou Eraste AKANDE</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        text-align: center;
        background: white;
        padding: 3rem 2rem;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      }
      .error-code {
        font-size: 8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #007BFF 0%, #E4B31A 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 2rem;
        color: #1E2A38;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.1rem;
        color: #4A4A4A;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        padding: 1rem 2rem;
        background: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      }
      .btn:hover {
        background: #0069d9;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
      }
      .brand {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid #eee;
        color: #4A4A4A;
        font-size: 0.9rem;
      }
      .loader {
        display: none;
        margin: 2rem auto;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #007BFF;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .redirecting {
        display: none;
        color: #007BFF;
        font-weight: 600;
        margin-top: 1rem;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      // Show redirecting message
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          document.getElementById('redirecting').style.display = 'block';
          document.getElementById('loader').style.display = 'block';
        }, 100);
      });

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <div id="loader" class="loader"></div>
      <p id="redirecting" class="redirecting">Redirecting you...</p>
      <a href="/eraste-akande/" class="btn">Go to Homepage</a>
      <div class="brand">
        <strong>Iyanou Eraste AKANDE</strong><br>
        Elasticsearch Consultant & Trainer
      </div>
    </div>
  </body>
</html>
